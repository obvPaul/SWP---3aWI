<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Summenrechner & Schülerinformationen</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <h1>Summenrechner</h1>
    <label for="zahl1">Erste Zahl:</label>
    <input type="number" id="zahl1" /><br /><br />

    <label for="zahl2">Zweite Zahl:</label>
    <input type="number" id="zahl2" /><br /><br />

    <button onclick="berechneSumme()">Berechnen</button>
    <h2>Ergebnis: <span id="ergebnis"></span></h2>

    <h1>Schülerliste</h1>
    <button onclick="ladeSchueler()">Lade Schüler</button>
    <ul id="schuelerListe"></ul>

    <h1>Schüler hinzufügen</h1>
    <label for="name">Name:</label>
    <input type="text" id="name" /><br /><br />

    <label for="geburtsdatum">Geburtsdatum:</label>
    <input type="date" id="geburtsdatum" /><br /><br />

    <label for="geschlecht">Geschlecht:</label>
    <select id="geschlecht">
      <option value="Männlich">Männlich</option>
      <option value="Weiblich">Weiblich</option></select
    ><br /><br />

    <label for="klasse">Schulklasse:</label>
    <input type="text" id="klasse" /><br /><br />

    <button onclick="addSchueler()">Hinzufügen</button>

    <h1>Statistiken</h1>
    <button onclick="ladeDurchschnittsalter()">Durchschnittsalter</button>
    <p id="durchschnittsalter"></p>

    <button onclick="ladeGeschlecht()">Anzahl nach Geschlecht</button>
    <p id="geschlechtStatistik"></p>
  </body>
</html>
